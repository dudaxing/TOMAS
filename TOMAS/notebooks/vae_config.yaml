OPTIMIZATION:
  # P0 (2026-06-12): restored to upstream-author-exact values
  # (github.com/UW-ERSL/TOMAS notebooks/vae_config.yaml): 17000 epochs,
  # CONSTANT lr 8e-3 (upstream has no lr_min / no scheduler).
  num_epochs: 17000
  kl_factor: 1.e-7
  lr: 8.e-3
  save_file: './vae_decoder_net.pkl'
NETWORK:
  # Branch p9 (2026-06-13): latent_dim 2 -> 3. The 2-D latent is the bottleneck
  # (A-deepening showed all shape methods are bounded by the 2-D VAE's
  # permeability<->contact-area Pareto; avg reconstruction ~20-45% vs paper
  # Table-1 0.1-4%). A 3-D latent gives the decoder more capacity to embed the
  # 6-D super-shape manifold -> lower reconstruction error -> a better Pareto
  # that should lift all three flow-physics methods (power toward the paper's 25).
  latent_dim: 3
  encoder_hidden_dim: 600
  decoder_hidden_dim: 600
