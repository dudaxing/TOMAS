SUPERSHAPE:
  min_a: 5.e-2
  max_a: 0.75
  min_b: 5.e-2
  max_b: 0.75
  # Concentrated on the 2-fold leaf/almond family (m ~= 2) with correlated
  # n1=n2=n3 in [0.5, 3.5]: low n -> pointed leaf, mid n -> almond/lens, high n
  # -> rounded oval, a!=b -> elongated/anisotropic. This makes the micro-structure
  # vocabulary leaf/almond-DOMINATED like the paper's designs (Figs 11/16), instead
  # of the star/circle-dominated set produced by the wide independent-uniform
  # sampling (m up to 11, n up to 10) of the committed default.
  min_m: 1.8
  max_m: 2.6
  min_n1: 0.5
  max_n1: 3.5
  min_n2: 0.5
  max_n2: 3.5
  min_n3: 0.5
  max_n3: 3.5
  min_cx: 1.e-5
  max_cx: 1.1e-5
  min_cy: 1.e-5
  max_cy: 1.1e-5
  shape_seed: 27
MESH:
  nelx: 150
  nely: 150
DATASET:
  num_samples: 100
  dataset_num: 1