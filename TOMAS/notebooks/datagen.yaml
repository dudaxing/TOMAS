SUPERSHAPE:
  min_a: 5.e-2
  max_a: 0.75
  min_b: 5.e-2
  max_b: 0.75
  # Branch B (p8b, 2026-06-13): FLUID-PRINCIPLED library. Cap m at 4 (was author
  # 11) on a flow-physics basis: the dataset flow-quality metric C_major/perim is
  # leaf m<2 0.0339 >> circle m2-4 0.0123 >> scallop m4-7 0.0059 >> star m7-11
  # 0.0038 (9x worse). High-m star/gear cells have flow-dead concave crevices
  # (recirculation, isotropic high drag) and only serve to game the geometric-
  # perimeter contact-area proxy. Capping m<=4 keeps ONLY the good-flow families
  # the user identified -- leaf/lens (m~2, low n), fish/eye (m<1), circle/ellipse
  # (m 2-4, high n) -- and drops scallop+star. n kept full [0.5,10] (low n at
  # m<=4 gives convex pointed lens/fish, NOT gears). Combined with anisotropy
  # stratification (run_p8b.sh) so the bent-pipe M* stays anisotropic.
  min_m: 0.5
  max_m: 4.
  min_n1: 0.5
  max_n1: 10.
  min_n2: 0.5
  max_n2: 10.
  min_n3: 0.5
  max_n3: 10.
  min_cx: 1.e-5
  max_cx: 1.1e-5
  min_cy: 1.e-5
  max_cy: 1.1e-5
  shape_seed: 27
MESH:
  nelx: 150
  nely: 150
DATASET:
  num_samples: 100
  dataset_num: 1
