SUPERSHAPE:
  min_a: 5.e-2
  max_a: 0.75
  min_b: 5.e-2
  max_b: 0.75
  # P0 (2026-06-12): UPSTREAM-AUTHOR-EXACT ranges, restored from
  # github.com/UW-ERSL/TOMAS notebooks/datagen.yaml. The paper TEXT (Sec 2.3)
  # says m in [1,22], but the AUTHORS' CODE — which produced the paper's
  # figures — uses m in [0.5,11]. Decisive evidence: the paper's Fig-10 ideal
  # micro-structure M* has m=0.604, INSIDE [0.5,11] (interpolation) but outside
  # [1,22] (extrapolation). m<1 is where the strongly-anisotropic leaf/fish/eye
  # shapes live, and m<=11 has no 12-22-point spiky stars.
  min_m: 0.5
  max_m: 11.
  min_n1: 0.5
  max_n1: 10.
  min_n2: 0.5
  max_n2: 10.
  min_n3: 0.5
  max_n3: 10.
  min_cx: 1.e-5
  max_cx: 1.1e-5
  min_cy: 1.e-5
  max_cy: 1.1e-5
  shape_seed: 27
MESH:
  nelx: 150
  nely: 150
DATASET:
  num_samples: 100
  dataset_num: 1
