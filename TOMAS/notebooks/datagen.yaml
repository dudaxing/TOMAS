SUPERSHAPE:
  min_a: 5.e-2
  max_a: 0.75
  min_b: 5.e-2
  max_b: 0.75
  # Paper-faithful ranges (Padhy et al. 2024, Sec. 2.3): 1 <= m <= 22 and
  # 0.5 <= n1,n2,n3 <= 10, sampled INDEPENDENTLY-uniform. (The committed default
  # used m in [0.5,11]; rounds 4-5 of this reproduction used correlated / narrow
  # m to force leaf shapes -- both deviated from the paper and are reverted here.)
  min_m: 1.0
  max_m: 22.0
  min_n1: 0.5
  max_n1: 10.0
  min_n2: 0.5
  max_n2: 10.0
  min_n3: 0.5
  max_n3: 10.0
  min_cx: 1.e-5
  max_cx: 1.1e-5
  min_cy: 1.e-5
  max_cy: 1.1e-5
  shape_seed: 27
MESH:
  nelx: 150
  nely: 150
DATASET:
  num_samples: 100
  dataset_num: 1